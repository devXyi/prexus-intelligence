[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prexus-core"
version = "0.1.0"
description = "Shared Prexus platform core: canonical JSON, signed audit ledger, signed bundles, ABAC"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[tool.setuptools.packages.find]
include = ["prexus_core*"]
