name: Air-gap control plane

on:
  push:
    paths:
      - "airgap/**"
      - "docker-compose.airgap.yml"
      - ".github/workflows/airgap-control-plane.yml"
  pull_request:
    paths:
      - "airgap/**"
      - "docker-compose.airgap.yml"
      - ".github/workflows/airgap-control-plane.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airgap/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
