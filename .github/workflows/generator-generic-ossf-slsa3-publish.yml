# SLSA level-3 provenance for REAL release artifacts (v1 was the unmodified template: it attested
# two placeholder text files, "artifact1" and "artifact2", i.e. nothing).
name: SLSA provenance

on:
  workflow_dispatch:
  release:
    types: [created]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build artifacts
        run: |
          mkdir -p dist
          (cd backend/backend && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../dist/prexus-gateway-linux-amd64 ./apps/api-gateway)
          pip install maturin && maturin build --release -m data-engine/rust/Cargo.toml -o dist
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -czf dist/prexus-airgap-control-plane.tar.gz -C airgap/control-plane server.mjs package.json lib tools public
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -czf dist/raksha-src.tar.gz packages/prexus_core modules/raksha
      - name: Subject hashes
        id: hash
        run: |
          cd dist && sha256sum * > ../SHA256SUMS && cd ..
          echo "digests=$(cat SHA256SUMS | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: release-artifacts, path: dist/*, if-no-files-found: error }

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
