# Ingress proxy for the enclave: the ONLY container with a published port. It is attached to the
# `ingress` network (host-reachable) and to the internal `enclave` network, and proxies to the
# control plane only. Docker publishes no ports for `internal: true` networks, hence this hop.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  server_tokens off;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 128k;
  limit_req_zone $binary_remote_addr zone=perip:1m rate=20r/s;
  resolver 127.0.0.11 valid=10s ipv6=off;               # Docker's embedded DNS
  server {
    listen 8080;
    add_header X-Content-Type-Options nosniff always;
    location / {
      limit_req zone=perip burst=40 nodelay;
      set $upstream http://control-plane:8787;           # variable ⇒ resolved at request time
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_read_timeout 35s;
      proxy_connect_timeout 3s;
    }
  }
}
