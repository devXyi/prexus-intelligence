[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "meteorium-engine"
version = "2.0.0"
description = "Meteorium Monte Carlo risk core (Rust/PyO3)"
requires-python = ">=3.9"
license = { text = "Proprietary" }

[tool.maturin]
module-name = "meteorium_engine"
features = ["extension-module"]
